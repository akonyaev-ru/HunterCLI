name: Build Hunter CLI

# Наименьшие привилегии по умолчанию: сборочные джобы читают код и НЕ должны
# иметь права записи в репозиторий. Право записи выдаётся точечно только джобу
# release (ниже). Все сторонние actions закреплены за проверенными commit SHA.
permissions:
  contents: read

# Раннеры GitHub англоязычные: без этого Python берёт кодировку из локали
# (cp1252) и любой русский print — в тестах, в set_version.py — падает с
# UnicodeEncodeError. Проверки при этом исправны, красной становится сборка.
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    # Только Windows: программа опирается на WebView2 (окно входа), DPAPI
    # (шифрование токена) и msvcrt (чтение клавиш). Собирать под другие ОС
    # смысла нет — там она всё равно не заработает целиком.
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # не сохранять токен в .git/config

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        # Без --live: тесты поднимают собственный сервер на localhost и в сеть
        # не ходят. Проверки против настоящего сервиса запускаются вручную.
        run: python tests/run_all.py

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HUNTER_VERSION: ${{ github.ref_name }}
        run: python tools/set_version.py

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean HunterCLI.spec

      - name: Smoke-check the executable
        # Проверяем, что собранный .exe запускается и что внутрь него попали
        # pywebview с WebView2: именно на упаковке этих зависимостей сборка
        # ломается чаще всего.
        #
        # Ищем ASCII-подстроку, а не русскую фразу: вывод .exe в UTF-8, а чем
        # его прочитает оболочка раннера — не наше дело, кириллица может
        # приехать искажённой. Код возврата --check тоже не критерий: он
        # ненулевой и когда на раннере просто нет сети.
        run: |
          $ErrorActionPreference = 'Continue'
          dist\HunterCLI.exe --version
          $report = (dist\HunterCLI.exe --check 2>&1 | Out-String)
          Write-Host $report
          if ($report -notmatch 'pywebview') {
            Write-Host 'FAILED: pywebview did not make it into the executable'
            exit 1
          }
          Write-Host 'OK: executable starts and pywebview is bundled'
          # Шаг обязан завершиться нулём. Иначе GitHub возьмёт код возврата
          # последней внешней команды — а `--check` отвечает единицей всякий
          # раз, когда на раннере нет доступа к сервису. Проверка про упаковку
          # .exe, а не про сеть в дата-центре GitHub.
          exit 0

      - name: Archive build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HunterCLI-Windows
          path: dist/HunterCLI.exe

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Право записи выдаётся ТОЛЬКО этому джобу — он публикует релиз.
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: HunterCLI-Windows

      # Архив не собираем: программа — один самодостаточный файл, и лишний
      # шаг «скачай, распакуй» только мешает. Кладём .exe в релиз как есть.
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Описание не составляем: в релизе нужен только файл. Автосписок
          # коммитов здесь ничего не объясняет читателю.
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            HunterCLI.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
