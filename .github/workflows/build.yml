name: Build Hunter CLI

# Наименьшие привилегии по умолчанию: сборочные джобы читают код и НЕ должны
# иметь права записи в репозиторий. Право записи выдаётся точечно только джобу
# release (ниже). Все сторонние actions закреплены за проверенными commit SHA.
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    # Только Windows: программа опирается на WebView2 (окно входа), DPAPI
    # (шифрование токена) и msvcrt (чтение клавиш). Собирать под другие ОС
    # смысла нет — там она всё равно не заработает целиком.
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false   # не сохранять токен в .git/config

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        # Без --live: тесты поднимают собственный сервер на localhost и в сеть
        # не ходят. Проверки против настоящего сервиса запускаются вручную.
        run: python tests/run_all.py

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HUNTER_VERSION: ${{ github.ref_name }}
        run: python tools/set_version.py

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean HunterCLI.spec

      - name: Smoke-check the executable
        # Проверяем, что собранный .exe вообще запускается и что внутрь него
        # попали pywebview с WebView2: именно на упаковке этих зависимостей
        # сборка ломается чаще всего. Связь с сетью на раннере не гарантируем,
        # поэтому смотрим только на факт запуска и наличие окна входа.
        run: |
          dist\HunterCLI.exe --version
          dist\HunterCLI.exe --check | Select-String -Pattern "встроенный браузер"

      - name: Archive build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HunterCLI-Windows
          path: dist/HunterCLI.exe

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Право записи выдаётся ТОЛЬКО этому джобу — он публикует релиз.
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: HunterCLI-Windows

      - name: Prepare archive
        run: |
          mkdir -p HunterCLI-Windows
          mv HunterCLI.exe HunterCLI-Windows/
          zip -r HunterCLI-Windows.zip HunterCLI-Windows/

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            HunterCLI-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
